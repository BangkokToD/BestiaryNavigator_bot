{% macro button_link(href, label, variant="ghost", class_name="", disabled=false) -%}
  <a
    class="bn-button bn-button--{{ variant }}{% if class_name %} {{ class_name }}{% endif %}"
    href="{{ href }}"
    {% if disabled %}aria-disabled="true" tabindex="-1"{% endif %}
  >
    {{ label }}
  </a>
{%- endmacro %}
