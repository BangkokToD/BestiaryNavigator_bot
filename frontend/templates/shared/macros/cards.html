{% macro card(title="", eyebrow="", text="", class_name="") -%}
  <article class="bn-card{% if class_name %} {{ class_name }}{% endif %}">
    <div class="bn-card__body">
      {% if eyebrow %}
        <p class="bn-card__eyebrow">{{ eyebrow }}</p>
      {% endif %}
      {% if title %}
        <h2 class="bn-card__title">{{ title }}</h2>
      {% endif %}
      {% if text %}
        <p class="bn-card__text">{{ text }}</p>
      {% endif %}
      {% if caller is defined %}
        {{ caller() }}
      {% endif %}
    </div>
  </article>
{%- endmacro %}
